# 服务器配置
server.port=8080

# 本地数据库配置（需要对接RDS）
spring.datasource.url=jdbc:mysql://localhost:3306/referral_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/New_York&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# 应用信息
spring.application.name=referral-backend

# Actuator配置
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# 日志配置
logging.level.org.moyi_tech.usermanagement=DEBUG
logging.level.org.springframework.security=DEBUG

# 应用时区配置
spring.jackson.time-zone=America/New_York

# 邮件配置 (需要改为referral.moyi-tech.org)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true