# Server configuration
server.port=8080

# Database configuration (local development)
spring.datasource.url=jdbc:mysql://localhost:3306/referral_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/New_York&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Application info
spring.application.name=referral-backend

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging configuration
logging.level.org.moyi_tech.usermanagement=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web.cors=DEBUG

# Timezone configuration
spring.jackson.time-zone=America/New_York

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.servlet.multipart.file-size-threshold=512KB

# Email configuration (update to referral.moyi-tech.org when deployed)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JWT configuration
app.jwtSecret=referralSystemSecretKey2025
app.jwtExpirationMs=604800000
# 7 days = 7 * 24 * 60 * 60 * 1000 = 604800000 ms

# CORS configuration (update for production)
app.cors.allowed-origins=http://localhost:3000,https://referral.moyi-tech.org